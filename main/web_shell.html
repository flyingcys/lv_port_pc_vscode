<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LVGL Simulator</title>
  <style>
    :root {
      --page-bg: #ffffff;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --panel-border: rgba(0, 0, 0, 0.12);
      --panel-shadow: rgba(0, 0, 0, 0.12);
      --button-ring: #1f2937;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background: var(--page-bg);
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      background: transparent;
    }

    .bg-chooser {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: var(--panel-bg);
      box-shadow: 0 8px 20px var(--panel-shadow);
      backdrop-filter: blur(8px);
    }

    .bg-chooser button {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 999px;
      cursor: pointer;
      appearance: none;
    }

    .bg-chooser button.is-active {
      outline: 2px solid var(--button-ring);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="bg-chooser" id="bg-chooser" aria-label="背景颜色选择">
    <button type="button" data-bg="#ffffff" title="白色" aria-label="白色" class="is-active" style="background:#ffffff"></button>
    <button type="button" data-bg="#e5e7eb" title="浅灰" aria-label="浅灰" style="background:#e5e7eb"></button>
    <button type="button" data-bg="#f3eadf" title="米色" aria-label="米色" style="background:#f3eadf"></button>
    <button type="button" data-bg="#d1d5db" title="深灰" aria-label="深灰" style="background:#d1d5db"></button>
  </div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    var rootStyle = document.documentElement.style;
    var chooser = document.getElementById('bg-chooser');
    var bgButtons = chooser.querySelectorAll('button[data-bg]');

    function setPageBackground(color) {
      rootStyle.setProperty('--page-bg', color);
      bgButtons.forEach(function(button) {
        button.classList.toggle('is-active', button.getAttribute('data-bg') === color);
      });
    }

    chooser.addEventListener('click', function(event) {
      var button = event.target.closest('button[data-bg]');
      if (!button) return;
      setPageBackground(button.getAttribute('data-bg'));
    });

    var Module = {
      preRun: [],
      postRun: [],
      canvas: (function() {
        return document.getElementById('canvas');
      })(),
      setStatus: function(text) {
        document.title = text ? 'LVGL Simulator - ' + text : 'LVGL Simulator';
      }
    };

    window.onerror = function(message) {
      Module.setStatus('运行失败');
      console.error(message);
    };

    setPageBackground('#ffffff');
  </script>
  {{{ SCRIPT }}}
</body>
</html>
