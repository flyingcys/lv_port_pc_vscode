<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LVGL Simulator</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      /* 与 Studio 运行预览弹层 body 一致：圆屏裁切外露黑底，非白底方框。 */
      background: #000000;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    var Module = {
      preRun: [],
      postRun: [],
      canvas: (function() {
        return document.getElementById('canvas');
      })(),
      setStatus: function(text) {
        document.title = text ? 'LVGL Simulator - ' + text : 'LVGL Simulator';
      }
    };

    window.onerror = function(message) {
      Module.setStatus('运行失败');
      console.error(message);
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
